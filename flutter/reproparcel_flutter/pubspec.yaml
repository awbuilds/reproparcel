name: reproparcel_flutter
description: Reference Dart contracts and Android bridge for ReproParcel. No real capture or upload.
version: 0.0.1-dev
publish_to: none
environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  test: ^1.25.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.awbuilds.reproparcel.flutter
        pluginClass: ReproParcelFlutterPlugin
