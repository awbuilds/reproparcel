name: CI

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Desktop install and tests
        run: |
          cd desktop
          npm ci
          npm test
      - name: Relay install and tests
        run: |
          cd server
          npm ci
          npm test
      - name: Public hygiene
        run: ./scripts/public-hygiene.sh --all
      - name: Dependency inventory
        run: python3 scripts/dependency_inventory.py
      - name: Dependency allowlist
        run: python3 scripts/check_dependencies.py
      - name: Compile, JVM tests and lint
        run: |
          ./gradlew \
            :reproparcel-core:test \
            :reproparcel-core:apiCheck \
            :reproparcel-android:assembleDebug \
            :reproparcel-android:assembleDebugAndroidTest \
            :reproparcel-android:testDebugUnitTest \
            :reproparcel-compose:assembleDebug \
            :reproparcel-compose:assembleDebugAndroidTest \
            :reproparcel-okhttp:assembleDebug \
            :sample-app:assembleDebug \
            :sample-app:assembleRelease \
            :sample-baseline:assembleRelease \
            :benchmark:assembleDebug \
            :benchmark:assembleBenchmark \
            lint
