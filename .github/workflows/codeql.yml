name: CodeQL

on:
  pull_request:
  push:
    branches:
      - dev
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  javascript:
    name: JavaScript / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  java-kotlin:
    name: Java / Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-37" "build-tools;36.1.0"
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build analyzed modules
        run: ./gradlew :reproparcel-core:assemble :reproparcel-android:assembleDebug --no-daemon
      - uses: github/codeql-action/analyze@v4
